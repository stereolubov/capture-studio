# cargo deny check — лицензии, дубликаты, уязвимости (§18.2).
[graph]
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]

[licenses]
# §20 п.1: до решения о лицензии — только пермиссивные лицензии.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "MPL-2.0",
]
confidence-threshold = 0.9

# Собственные крейты (publish = false) не проверяются.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
