[package]
name = "cs-app"
description = "Capture Studio: точка входа, окно, egui-UI, темы, i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "capture-studio"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
cs-core.workspace = true
cs-gpu.workspace = true
cs-diag.workspace = true
cs-capture.workspace = true
cs-audio.workspace = true
cs-encode.workspace = true
cs-output.workspace = true
cs-hotkeys.workspace = true
egui.workspace = true
anyhow.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
] }

[build-dependencies]
